<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send an anonymous song</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body><div class="nglwrap">

<section id="sLoad"><div class="empty">Loading...</div></section>

<section id="sForm" hidden>
 <div class="ngl-card">
  <div class="ngl-head"><div class="ngl-av" id="sAv"></div><div><b id="sName"></b><span>send me an anonymous song</span></div></div>
  <textarea id="sText" maxlength="1000" placeholder="write a message..." aria-label="Your message"></textarea>
  <div class="ngl-song">
   <input id="sq" placeholder="Search a song to send" autocomplete="off" aria-label="Song">
   <div class="res" id="sres" hidden></div><div id="spicked"></div>
  </div>
  <p class="ngl-note" id="sNote"></p>
 </div>
 <button class="btn full ngl-send" id="sSend">Send!</button>
 <p class="msg" id="sMsg" role="status"></p>
 <a class="btn ghost full" href="index.html">Get your own link</a>
</section>

<section id="sDone" class="ngl-done" hidden>
 <h2>sent!</h2>
 <p class="sub">Your song is on its way. Nobody will know it was you.</p>
 <button class="btn full" id="sAgain">Send another</button>
 <a class="btn ghost full" href="index.html">Get your own link</a>
</section>

<section id="sMiss" class="ngl-done" hidden>
 <h2>hmm.</h2>
 <p class="sub" id="sMissTxt"></p>
 <a class="btn full" href="index.html">Go to Anonymous</a>
</section>

<section id="sMaint" class="ngl-done" hidden>
 <h2>back soon.</h2>
 <p class="sub" id="sMaintTxt"></p>
</section>

</div>
<script src="config.js"></script>
<script src="send.js"></script>
</body></html>
